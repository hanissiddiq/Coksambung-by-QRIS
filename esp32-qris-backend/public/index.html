<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewa Stopkontak QRIS</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            color: #1a1a1a;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .slot-card {
            background: #fafafa;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }

        .slot-info h3 {
            font-size: 18px;
            color: #222;
        }

        .badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-top: 5px;
        }

        .badge.tersedia {
            background: #e6f9ed;
            color: #28a745;
        }

        .badge.digunakan {
            background: #fde8e8;
            color: #dc3545;
        }

        .btn-sewa {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .btn-sewa.disabled {
            background: #ccc;
            pointer-events: none;
        }

        .footer {
            font-size: 11px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>⚡ Stasiun Pengisian Daya</h1>
            <p>Pilih slot kosong untuk mengaktifkan aliran listrik via QRIS</p>
        </div>

        <div class="slot-wrapper">
           <div class="slot-wrapper">
    <!-- Slot 1 -->
    <div class="slot-card">
        <div class="slot-info">
            <h3>Stopkontak Slot 1</h3>
            <span id="badge-1" class="badge tersedia">Memuat...</span>
            <div style="margin-top: 10px;">
                <label style="font-size: 12px; color: #666;">Pilih Durasi:</label>
                <select id="durasi-1" style="padding: 5px; border-radius: 5px; border: 1px solid #ccc;">
                    <option value="1">1 Jam - Rp 5.000</option>
                    <option value="2">2 Jam - Rp 10.000</option>
					<option value="3">3 Jam - Rp 15.000</option>
					<option value="4">4 Jam - Rp 20.000</option>
                </select>
            </div>
        </div>
        <button id="btn-1" onclick="sewaSlot(1)" class="btn-sewa">Pilih Slot</button>
    </div>

    <!-- Slot 2 -->
    <div class="slot-card">
        <div class="slot-info">
            <h3>Stopkontak Slot 2</h3>
            <span id="badge-2" class="badge tersedia">Memuat...</span>
            <div style="margin-top: 10px;">
                <label style="font-size: 12px; color: #666;">Pilih Durasi:</label>
                <select id="durasi-2" style="padding: 5px; border-radius: 5px; border: 1px solid #ccc;">
                    <option value="1">1 Jam - Rp 5.000</option>
                    <option value="2">2 Jam - Rp 10.000</option>
					<option value="3">3 Jam - Rp 15.000</option>
					<option value="4">4 Jam - Rp 20.000</option>
                </select>
            </div>
        </div>
        <button id="btn-2" onclick="sewaSlot(2)" class="btn-sewa">Pilih Slot</button>
    </div>
</div>
        </div>

        <div class="footer">
            <p>Pembayaran aman otomatis didukung oleh QRIS</p>
        </div>
    </div>

    <script>

// Tambahkan fungsi JavaScript ini di dalam tag <script> yang sudah ada
function sewaSlot(slotNum) {
    const durasi = document.getElementById(`durasi-${slotNum}`).value;
    // Mengalihkan halaman sambil membawa data durasi ke backend
    window.location.href = `/order-slot/${slotNum}?durasi=${durasi}`;
}

        // Fungsi mengambil status dari backend setiap 3 detik
        async function updateStatus() {
            try {
                let response = await fetch('/api/cek_status');
                let data = await response.json();

                // Update Slot 1
                let badge1 = document.getElementById('badge-1');
                let btn1 = document.getElementById('btn-1');
                if (data.slot1 === 1) {
                    badge1.className = 'badge digunakan';
                    badge1.innerText = 'Sedang Digunakan';
                    btn1.className = 'btn-sewa disabled';
                    btn1.innerText = 'Terpakai';
                } else {
                    badge1.className = 'badge tersedia';
                    badge1.innerText = 'Tersedia';
                    btn1.className = 'btn-sewa';
                    btn1.innerText = 'Pilih Slot';
                }

                // Update Slot 2
                let badge2 = document.getElementById('badge-2');
                let btn2 = document.getElementById('btn-2');
                if (data.slot2 === 1) {
                    badge2.className = 'badge digunakan';
                    badge2.innerText = 'Sedang Digunakan';
                    btn2.className = 'btn-sewa disabled';
                    btn2.innerText = 'Terpakai';
                } else {
                    badge2.className = 'badge tersedia';
                    badge2.innerText = 'Tersedia';
                    btn2.className = 'btn-sewa';
                    btn2.innerText = 'Pilih Slot';
                }
            } catch (error) {
                console.error('Gagal memuat status:', error);
            }
        }

        // Jalankan saat halaman dibuka
        updateStatus();

        // Ulangi setiap 3 detik
        setInterval(updateStatus, 3000);
    </script>

</body>
</html>
